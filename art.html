<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rev Up · art sheet (dev only)</title>
<style>
  body { margin: 0; background: #1b2128; color: #dfe6ec; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  nav { padding: 8px; } nav a { color: #ffc457; margin-right: 12px; }
</style>
</head>
<body>
<nav><a href="?">Cars</a><a href="?sheet=liveries">Liveries</a><a href="?sheet=styles">Wheels and paint</a><a href="?sheet=scenes">Scenes</a><a href="?sheet=service">Service bay</a><a href="?sheet=race">Race sizes</a><a href="?sheet=concours">Concours</a><a href="?sheet=parts">Parts T7–T10</a><a href="?sheet=bay">Bay</a><a href="?sheet=hero">Hero</a><a href="?sheet=reveal">Reveal FX</a><a href="?sheet=rivals">Rivals</a><a href="?sheet=grids">Rival grids</a><a href="?lit">Lit</a></nav>
<canvas id="c"></canvas>
<script type="module">
  // Dev-only art sheet: every car at hero / card / race / thumbnail sizes, plus liveries, wheel sets, materials and race scenery.
  import { drawCar, drawHeroCar, ART_CARS, FACTORY_LOOKS, LIVERIES, RIVAL_ART_IDS, carLengthM, serviceZones, tailLampPoint } from '/src/render/car.ts';
  import { RIVAL_LOOKS, artOf, rivalCarModel } from '/src/data/rivalCars.ts';
  import { drawServiceBay, bayFloorY } from '/src/render/bay.ts';
  import { drawRevealSignature, REVEAL_SIGNATURE_CARS } from '/src/render/revealFx.ts';
  import { partSvg } from '/src/render/parts.ts';
  import { CARS, EVENTS, RIVALS, SIGNATURE_FINISHES } from '/src/data/tables.ts';
  import { drawBackdrop, drawRoadDressing, drawForeground, roadColors, THEMES } from '/src/render/scene.ts';
  const q = new URLSearchParams(location.search);
  const sheet = q.get('sheet') ?? 'cars';
  const only = q.get('car');
  const NAMES = { rally: 'Corvo Rally', gt: 'Strata GTR', proto: 'Halcyon X' };
  const look = (id) => { const c = CARS.find((x) => x.id === id); const f = FACTORY_LOOKS[id]; return { id, model: c && c.model !== '—' ? c.model : NAMES[id], paint: f?.paint ?? c.paint, trim: f?.trim ?? c.trim }; };
  const cars = ART_CARS.filter((id) => !only || id === only).map(look);
  const W = innerWidth;
  const c = document.getElementById('c');
  const dpr = Math.min(2, devicePixelRatio || 1);
  const size = (H) => { c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px'; const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); return ctx; };
  const bg = (ctx, y0, h) => { const g = ctx.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, '#3a4652'); g.addColorStop(0.7, '#1c232a'); g.addColorStop(1, '#12171c'); ctx.fillStyle = g; ctx.fillRect(0, y0, W, h); };
  if (sheet === 'cars') {
    const RH = 330;
    const ctx = size(cars.length * RH);
    cars.forEach((car, i) => {
      const y0 = i * RH;
      bg(ctx, y0, RH);
      ctx.fillStyle = '#dfe6ec'; ctx.fillText(`${car.model} (${car.id})`, 10, y0 + 16);
      const hero = Math.min(W * 0.5, 560);
      drawCar(ctx, car.id, 20, y0 + 270, hero * 0.9, { paint: car.paint, trim: car.trim, headlights: q.has('lit') ? 1 : 0, wheelAngle: 0.3, light: Number(q.get('light') ?? 0) });
      const sig = SIGNATURE_FINISHES[car.id];
      const x = hero + 60;
      drawCar(ctx, car.id, x, y0 + 110, 200, { paint: sig?.paint ?? car.paint, trim: car.trim, livery: sig?.stripe, style: sig ? undefined : { livery: 'number' } });
      drawCar(ctx, car.id, x + 250, y0 + 110, 200, { paint: car.paint, trim: car.trim, style: { livery: LIVERIES[i % LIVERIES.length].id } });
      drawCar(ctx, car.id, x, y0 + 210, 130, { paint: car.paint, trim: car.trim, cache: true, wheelAngle: 1, nitro: 1.5, headlights: 0.5, blur: 0.7 });
      drawCar(ctx, car.id, x + 160, y0 + 210, 96, { paint: car.paint, trim: car.trim, cache: true });
      drawCar(ctx, car.id, x + 280, y0 + 210, 60, { paint: car.paint, trim: car.trim, cache: true });
      drawCar(ctx, car.id, x + 370, y0 + 210, 40, { paint: car.paint, trim: car.trim });
      drawCar(ctx, car.id, x, y0 + 300, 130, { paint: car.paint, trim: car.trim, cover: 1 });
      drawCar(ctx, car.id, x + 160, y0 + 300, 130, { paint: car.paint, trim: car.trim, silhouette: true });
    });
  } else if (sheet === 'liveries') {
    const RH = 150, cols = 4;
    const ctx = size(LIVERIES.length * RH + 30);
    const pick = ['hothatch', 'muscle', 'rally', 'proto'].map(look);
    LIVERIES.forEach((lv, i) => {
      const y0 = i * RH; bg(ctx, y0, RH);
      ctx.fillStyle = '#dfe6ec'; ctx.fillText(`${lv.name} (${lv.id})`, 10, y0 + 16);
      pick.forEach((car, k) => drawCar(ctx, car.id, 10 + k * (W / cols), y0 + 125, W / cols - 40, { paint: car.paint, trim: car.trim, style: { livery: lv.id } }));
    });
  } else if (sheet === 'styles') {
    const wheels = ['steel', 'turbine', 'fivespoke', 'dish', 'wire', 'aero', 'gravel', 'race'];
    const mats = [undefined, 'metallic', 'pearl', 'candy', 'matte', 'chrome', 'flip'];
    const ctx = size(430);
    bg(ctx, 0, 430);
    wheels.forEach((w, k) => { drawCar(ctx, 'gt', 10 + (k % 4) * (W / 4), 90 + Math.floor(k / 4) * 100, W / 4 - 40, { paint: '#d5dade', trim: '#d6202a', style: { wheel: w } }); ctx.fillStyle = '#dfe6ec'; ctx.fillText(w, 10 + (k % 4) * (W / 4), 100 + Math.floor(k / 4) * 100); });
    mats.forEach((m, k) => { drawCar(ctx, 'tourer', 10 + (k % 4) * (W / 4), 300 + Math.floor(k / 4) * 110, W / 4 - 40, { paint: '#b0242a', trim: '#e9d8b4', style: { material: m } }); ctx.fillStyle = '#dfe6ec'; ctx.fillText(m ?? 'gloss', 10 + (k % 4) * (W / 4), 312 + Math.floor(k / 4) * 110); });
  } else if (sheet === 'service') {
    // service bay: hood closed / half / open, focus areas and the serviceZones hit boxes
    const RH = 250;
    const ctx = size(cars.length * RH);
    cars.forEach((car, i) => {
      const y0 = i * RH; bg(ctx, y0, RH);
      ctx.fillStyle = '#dfe6ec'; ctx.fillText(`${car.model} (${car.id})`, 10, y0 + 16);
      const cw = Math.min(W / 3 - 30, 420);
      [[0, 'engine'], [0.45, null], [1, 'engine']].forEach(([hood, focus], k) => {
        const x = 15 + k * (W / 3), y = y0 + RH - 40;
        drawCar(ctx, car.id, x, y, cw, { paint: car.paint, trim: car.trim, hood, focus: k === 0 ? 'wheels' : focus, light: 0.6, detail: true });
        if (k === 2) {
          const z = serviceZones(car.id, x, y, cw, hood);
          ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 1;
          for (const b of [z.engine, ...z.wheels, z.body]) ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
      });
    });
  } else if (sheet === 'race') {
    // race-size cached sprites on a dark road, with blur, nitro and brake lights
    const RH = 70, cols = 3;
    const ctx = size(Math.ceil(cars.length / cols) * RH + 20);
    bg(ctx, 0, Math.ceil(cars.length / cols) * RH + 20);
    cars.forEach((car, i) => {
      const x = 80 + (i % cols) * (W / cols), y = 60 + Math.floor(i / cols) * RH;
      drawCar(ctx, car.id, x, y, 4.6 * 22, { paint: car.paint, trim: car.trim, cache: true, detail: false, wheelAngle: i, blur: i % 2 ? 0.8 : 0.3, nitro: 1.2, brake: true, headlights: 0.4 });
      ctx.fillStyle = '#dfe6ec'; ctx.fillText(car.id, x, y + 12);
    });
  } else if (sheet === 'concours') {
    // Concours restoration stages 0..3 (stage 2 opens the hood to show the detailed bay), brake lamps on each tail
    const list = only ? cars : ['muscle', 'tourer', 'vireo', 'sovereign'].map(look);
    const RH = 200;
    const ctx = size(list.length * RH);
    list.forEach((car, i) => {
      const y0 = i * RH; bg(ctx, y0, RH);
      const cw = W / 4 - 30;
      [0, 1, 2, 3].forEach((cc) => {
        const x = 12 + cc * (W / 4), y = y0 + RH - 30;
        drawCar(ctx, car.id, x, y, cw, { paint: car.paint, trim: car.trim, style: { concours: cc }, hood: cc === 2 ? 0.9 : 0, detail: true, brake: cc === 0 });
        if (cc === 0) { const t = tailLampPoint(car.id, x, y, cw); ctx.strokeStyle = '#0f0'; ctx.strokeRect(t.x - 3, t.y - 3, 6, 6); }
        ctx.fillStyle = '#dfe6ec'; ctx.fillText(`${car.id} · concours ${cc}`, x, y0 + 16);
      });
    });
  } else if (sheet === 'parts') {
    document.body.insertAdjacentHTML('beforeend', `<div style="display:grid;grid-template-columns:repeat(4,96px);gap:10px;padding:12px;background:#151a20">${['engine', 'tires', 'turbo'].map((f) => [7, 8, 9, 10].map((t) => `<div style="width:96px;height:96px;background:#222a33;border-radius:12px;padding:6px;box-sizing:border-box">${partSvg(f, t, 'std', { badge: true })}</div>`).join('')).join('')}</div>`);
  } else if (sheet === 'bay') {
    // the Mechanic Shop backdrop in each area (phone-size panels), with a car on the lift
    const areas = ['engine', 'wheels', 'body', 'tuning'], pw = 390, ph = 300;
    const ctx = size(Math.ceil(areas.length / 2) * ph);
    const car = look(only ?? 'tempest');
    areas.forEach((a, i) => {
      const off = document.createElement('canvas'); off.width = pw * dpr; off.height = ph * dpr;
      const o = off.getContext('2d');
      drawServiceBay(o, off.width, off.height, { area: a, light: 1, t: 2 });
      const cw = off.width * 0.72;
      drawCar(o, car.id, (off.width - cw) / 2, bayFloorY(off.height), cw, { paint: car.paint, trim: car.trim, detail: true, light: 0.6, hood: a === 'engine' ? 0.8 : 0, focus: a === 'tuning' ? null : a });
      ctx.drawImage(off, (i % 2) * (pw + 10), Math.floor(i / 2) * ph, pw, ph);
      ctx.fillStyle = '#fff'; ctx.fillText(a, (i % 2) * (pw + 10) + 8, Math.floor(i / 2) * ph + 16);
    });
  } else if (sheet === 'hero') {
    // the title-screen hero helper at three sweep positions, with and without a rim light
    const list = only ? cars : ['tempest', 'meridian', 'ardent', 'sovereign'].map(look);
    const RH = 230;
    const ctx = size(list.length * RH);
    list.forEach((car, i) => {
      const y0 = i * RH; ctx.fillStyle = '#07080b'; ctx.fillRect(0, y0, W, RH);
      [0.2, 0.5, 0.8].forEach((sw, k) => drawHeroCar(ctx, car.id, 20 + k * (W / 3), y0 + RH - 40, W / 3 - 60, { paint: car.paint, trim: car.trim, sweep: sw, rimLight: k === 1 ? '#9fe6ff' : 0.6, headlights: 1 }));
    });
  } else if (sheet === 'reveal') {
    // signature reveal moments: lights at 0.15 s and 0.5 s, then mid-turn; add &reduced for the reduced-motion version
    const red = q.has('reduced'), RH = 220;
    const ctx = size(REVEAL_SIGNATURE_CARS.length * RH);
    REVEAL_SIGNATURE_CARS.map(look).forEach((car, i) => {
      const y0 = i * RH; ctx.fillStyle = '#07080b'; ctx.fillRect(0, y0, W, RH);
      [['lights', 0.15], ['lights', 0.5], ['turn', 0.8]].forEach(([ph, t], k) => {
        const x = 20 + k * (W / 3), y = y0 + RH - 40, cw = W / 3 - 60;
        drawCar(ctx, car.id, x, y, cw, { paint: car.paint, trim: car.trim, detail: true, light: 0.7, headlights: 0.85 });
        drawRevealSignature(ctx, car.id, x, y, cw, ph, t, red);
        ctx.fillStyle = '#dfe6ec'; ctx.fillText(`${car.id} · ${ph} ${t}s${red ? ' · reduced' : ''}`, x, y0 + 16);
      });
    });
  } else if (sheet === 'bench') {
    // race-frame benchmark: 4 lanes of cached cars at phone race size (390 css px × dpr 2) with blur, nitro, brakes and
    // headlights, the camera zooming slowly. Reports window.__bench = { coldMs, avgMs, p95Ms } (used by the perf scripts).
    const ids = (q.get('cars') ?? 'tempest,meridian,ardent,sovereign').split(',');
    const cw = 390, ch = 420, k = 2;
    c.width = cw * k; c.height = ch * k; c.style.width = cw + 'px'; c.style.height = ch + 'px';
    const ctx = c.getContext('2d');
    const frame = (i) => {
      ctx.fillStyle = '#2a3038'; ctx.fillRect(0, 0, c.width, c.height);
      ids.forEach((id, n) => {
        const car = look(id);
        const len = (4.4 + (q.get('zoom') === '0' ? 0 : 0.25 * Math.sin(i / 90))) * 22 * k;
        drawCar(ctx, id, 40 * k + n * 12 * k + (i % 50), (150 + n * 60) * k, len, { paint: car.paint, trim: car.trim, cache: true, detail: false, wheelAngle: i * 0.4, blur: 0.4 + (n % 2) * 0.5, nitro: n % 2 ? 1.2 : 0, brake: i % 40 < 8, headlights: 0.4 });
      });
    };
    const t0 = performance.now(); frame(0); const coldMs = performance.now() - t0;
    const times = []; let i = 1;
    const step = () => { const a = performance.now(); frame(i++); times.push(performance.now() - a); if (times.length < 240) requestAnimationFrame(step); else { const s = [...times].sort((x, y) => x - y); window.__bench = { coldMs: +coldMs.toFixed(1), avgMs: +(times.reduce((x, y) => x + y, 0) / times.length).toFixed(2), p95Ms: +s[Math.floor(s.length * 0.95)].toFixed(2) }; } };
    requestAnimationFrame(step);
  } else if (sheet === 'rivals') {
    // opponent-only cars: the close-up, the race sprite (lit, boosting, braking), race sizes, the silhouette, and the
    // roster car of the same class at the same race scale for comparison; &builds adds the roster-body builds
    const list = Object.values(RIVAL_LOOKS).filter((l) => (q.has('builds') ? true : RIVAL_ART_IDS.includes(l.id)) && (!only || l.id === only));
    const RH = 250, ppm = 21;
    const ctx = size(list.length * RH);
    const drivers = (id) => Object.values(RIVALS).filter((r) => r.look === id && !r.id.includes('@')).map((r) => r.name.split(' ')[0]);
    list.forEach((lk, i) => {
      const y0 = i * RH; bg(ctx, y0, RH);
      ctx.fillStyle = '#dfe6ec'; ctx.font = '700 13px system-ui';
      ctx.fillText(`${lk.model} (${lk.id}) · class ${lk.car} · ${lk.L} m · voice ${lk.voice} · ${drivers(lk.id).join(', ')}`, 10, y0 + 16);
      ctx.font = '12px system-ui'; ctx.fillStyle = '#9fb0bf'; ctx.fillText(lk.blurb, 10, y0 + 32);
      const hero = Math.min(W * 0.45, 520);
      drawCar(ctx, lk.art, 20, y0 + RH - 25, hero * lk.L / 5.4, { paint: lk.paint, trim: lk.trim, style: lk.style, wheelAngle: 0.3, detail: true, light: Number(q.get('light') ?? 0) });
      const x = hero + 60;
      drawCar(ctx, lk.art, x, y0 + 120, lk.L * ppm * 1.6, { paint: lk.paint, trim: lk.trim, style: lk.style, cache: true, detail: false, wheelAngle: 1, nitro: 1.4, headlights: 0.6, brake: true, blur: 0.7 });
      drawCar(ctx, lk.art, x + 200, y0 + 120, lk.L * ppm, { paint: lk.paint, trim: lk.trim, style: lk.style, cache: true, detail: false });
      drawCar(ctx, lk.art, x + 330, y0 + 120, lk.L * ppm * 0.6, { paint: lk.paint, trim: lk.trim, style: lk.style, cache: true, detail: false });
      drawCar(ctx, lk.art, x, y0 + 220, lk.L * ppm, { paint: lk.paint, trim: lk.trim, silhouette: true });
      const ros = look(lk.car);
      drawCar(ctx, lk.car, x + 200, y0 + 220, carLengthM(lk.car) * ppm, { paint: ros.paint, trim: ros.trim, cache: true, detail: false });
      ctx.fillStyle = '#7f8d99'; ctx.fillText(`roster ${ros.model}`, x + 200, y0 + 236);
    });
  } else if (sheet === 'grids') {
    // every race's rivals at race size, one lane each, as they line up (look id under each car)
    const evs = EVENTS.filter((e) => e.rivals.length && !e.knockout);
    const RH = 150, ppm = 19;
    const ctx = size(evs.length * RH);
    evs.forEach((e, i) => {
      const y0 = i * RH; bg(ctx, y0, RH);
      ctx.fillStyle = '#dfe6ec'; ctx.font = '700 13px system-ui'; ctx.fillText(`${e.name} (${e.id})`, 10, y0 + 16);
      e.rivals.forEach((rid, k) => {
        const r = RIVALS[rid]; const lk = RIVAL_LOOKS[r.look];
        const art = artOf(r), Lm = carLengthM(art);
        const trim = lk?.trim ?? look(r.car).trim;
        const x = 20 + k * (W / 3.2), y = y0 + 110;
        drawCar(ctx, art, x, y, Lm * ppm, { paint: r.paint, trim, style: lk?.style, cache: true, detail: false, wheelAngle: k });
        ctx.fillStyle = '#dfe6ec'; ctx.font = '12px system-ui'; ctx.fillText(`${r.name} · ${rivalCarModel(r)}`, x, y + 22);
      });
    });
  } else if (sheet === 'scenes') {
    // phone-size race frames for every theme (390x420 css each)
    const sw = 390, sh = 420, per = Math.max(1, Math.floor(W / sw));
    const rows = Math.ceil(THEMES.length / per);
    const ctx = size(rows * sh);
    const t = Number(q.get('t') ?? 3);
    THEMES.forEach((theme, i) => {
      const ox = (i % per) * sw, oy = Math.floor(i / per) * sh;
      ctx.save(); ctx.translate(ox, oy); ctx.beginPath(); ctx.rect(0, 0, sw, sh); ctx.clip();
      const roadBot = sh * 0.84, roadTop = roadBot - sh * 0.36, horizon = roadTop - sh * 0.09;
      const v = { ctx, W: sw, H: sh, dpr: 1, horizon, roadTop, roadBot, camX: 120 + t * 30, ppm: 15, t, theme, trackId: q.get('track') ?? theme, reduced: false };
      drawBackdrop(v);
      ctx.fillStyle = roadColors(theme).road; ctx.fillRect(0, roadTop, sw, roadBot - roadTop);
      drawRoadDressing(v);
      ctx.fillStyle = 'rgba(255,240,200,0.55)'; for (let l = 1; l < 4; l++) for (let x = 0; x < sw; x += 60) ctx.fillRect(x, roadTop + l * (roadBot - roadTop) / 4, 30, 3);
      ctx.fillStyle = 'rgba(242,163,58,0.28)'; ctx.fillRect(250, roadTop, 120, roadBot - roadTop);
      const lane = (roadBot - roadTop) / 4;
      ['hothatch', 'rally', 'gt', 'proto'].map(look).forEach((car, k) => drawCar(ctx, car.id, 30 + k * 70, roadTop + (k + 0.85) * lane, 70, { paint: car.paint, trim: car.trim, cache: true, detail: false, headlights: theme === 'night' ? 1 : 0.3, nitro: k === 0 ? 1 : 0 }));
      drawForeground(v);
      ctx.fillStyle = '#fff'; ctx.font = '800 15px system-ui'; ctx.fillText(`${theme} · 2nd · 112 mph`, 12, 24);
      ctx.restore();
    });
  }
</script>
</body>
</html>
